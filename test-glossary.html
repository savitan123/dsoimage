<!DOCTYPE html>
<html>

<body>
    <div id="output"></div>
    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            document.getElementById("output").innerText = "Error: " + msg + " at line " + lineNo;
        };
    </script>
    <script src="js/glossary_data.js"></script>
    <script>
        if (typeof GLOSSARY_ITEMS !== 'undefined') {
            document.getElementById("output").innerText += "\nSuccess: " + typeof GLOSSARY_ITEMS + " length: " + GLOSSARY_ITEMS.length;
        } else {
            document.getElementById("output").innerText += "\nGLOSSARY_ITEMS is undefined but no window.onerror fired (or error was fatal).";
        }
    </script>
</body>

</html>
