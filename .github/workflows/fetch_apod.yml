name: Daily NASA APOD Cache

on:
  schedule:
    # Primary run at 06:00 UTC (shortly after NASA publishes the daily image)
    - cron: '0 6 * * *'
    # Retry run at 13:00 UTC in case the morning run was skipped or failed
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual runs for testing

jobs:
  fetch-apod:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Fetch APOD from NASA API
        id: fetch
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          # Use the secret key, fall back to DEMO_KEY only if the secret is not set
          API_KEY="${NASA_API_KEY:-DEMO_KEY}"

          echo "Fetching APOD with key: ${API_KEY:0:4}****"

          HTTP_STATUS=$(curl -s -o /tmp/apod_response.json -w "%{http_code}" \
            "https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&thumbs=true")

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "API call failed with status $HTTP_STATUS — keeping existing cache."
            cat /tmp/apod_response.json || true
            exit 0
          fi

          # Validate that the response contains a 'url' or 'thumbnail_url' field
          URL_CHECK=$(cat /tmp/apod_response.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          u = data.get('url') or data.get('thumbnail_url', '')
          print('ok' if u else 'missing')
          ")

          if [ "$URL_CHECK" != "ok" ]; then
            echo "Response missing URL field — keeping existing cache."
            exit 0
          fi

          # Pretty-print the JSON and save to the cache file
          python3 -c "
          import json, sys
          data = json.load(open('/tmp/apod_response.json'))
          # Keep only the fields the frontend needs
          out = {
            'date':          data.get('date', ''),
            'title':         data.get('title', ''),
            'explanation':   data.get('explanation', ''),
            'url':           data.get('url', ''),
            'hdurl':         data.get('hdurl', ''),
            'media_type':    data.get('media_type', 'image'),
            'thumbnail_url': data.get('thumbnail_url', ''),
            'copyright':     data.get('copyright', '')
          }
          with open('data/apod_cache.json', 'w') as f:
            json.dump(out, f, indent=2)
          print('Cache written successfully.')
          "

          echo "Fetch and write succeeded."

      - name: Commit updated cache if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/apod_cache.json

          # Only commit if there is something to commit
          if git diff --cached --quiet; then
            echo "No changes to apod_cache.json — nothing to commit."
          else
            git commit -m "chore: update NASA APOD cache [skip ci]"
            git push
          fi
