name: Daily Moon Phase Cache

on:
  schedule:
    # Runs every 4 hours to keep the moon phase highly accurate
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual runs

jobs:
  fetch-moon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install ephem
        run: pip install ephem

      - name: Calculate Moon Phase (ephem)
        run: |
          python3 - <<'PYEOF'
          import ephem, datetime, json, math

          # Current UTC time
          now_utc = datetime.datetime.utcnow()
          now_ephem = ephem.Date(now_utc)

          # Compute moon
          moon = ephem.Moon()
          moon.compute(now_utc)

          # Illumination (ephem gives 0-100 float)
          illumination = round(float(moon.phase))

          # Determine phase name from cycle position
          prev_new = ephem.previous_new_moon(now_ephem)
          next_new = ephem.next_new_moon(now_ephem)
          cycle_days = float(next_new - prev_new)
          days_into  = float(now_ephem - prev_new)
          ratio = days_into / cycle_days  # 0.0=New ... 1.0=New again

          if   ratio < 0.03:  phase = "New Moon"
          elif ratio < 0.25:  phase = "Waxing Crescent"
          elif ratio < 0.27:  phase = "First Quarter"
          elif ratio < 0.50:  phase = "Waxing Gibbous"
          elif ratio < 0.53:  phase = "Full Moon"
          elif ratio < 0.75:  phase = "Waning Gibbous"
          elif ratio < 0.77:  phase = "Last Quarter"
          else:               phase = "Waning Crescent"

          # Next significant phase (whichever is soonest)
          candidates = {
              "New Moon":     ephem.next_new_moon(now_ephem),
              "First Quarter":ephem.next_first_quarter_moon(now_ephem),
              "Full Moon":    ephem.next_full_moon(now_ephem),
              "Last Quarter": ephem.next_last_quarter_moon(now_ephem),
          }
          next_phase_name = min(candidates, key=lambda k: candidates[k])
          next_phase_dt   = ephem.Date(candidates[next_phase_name]).datetime()

          # Moon rise/set for Israel (Tel Aviv: 31.05N, 34.85E, UTC+2)
          obs = ephem.Observer()
          obs.lat  = '31.05'
          obs.lon  = '34.85'
          obs.elevation = 30
          obs.date = now_ephem

          try:
              moonrise = ephem.localtime(obs.next_rising(moon)).strftime('%H:%M')
          except Exception:
              moonrise = ''
          try:
              moonset = ephem.localtime(obs.next_setting(moon)).strftime('%H:%M')
          except Exception:
              moonset = ''

          out = {
              "date":         now_utc.strftime('%Y-%m-%d'),
              "phase":        phase,
              "illumination": illumination,
              "moonrise":     moonrise,
              "moonset":      moonset,
              "closestphase": {
                  "phase": next_phase_name,
                  "date":  next_phase_dt.strftime('%Y-%m-%d'),
                  "time":  next_phase_dt.strftime('%H:%M')
              },
              "updated": now_utc.strftime('%Y-%m-%dT%H:%M:%SZ')
          }

          with open('data/moon_cache.json', 'w') as f:
              json.dump(out, f, indent=2)

          print("Moon cache written:")
          print(json.dumps(out, indent=2))
          PYEOF

      - name: Commit updated cache if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/moon_cache.json

          if git diff --cached --quiet; then
            echo "No changes to moon_cache.json — nothing to commit."
          else
            git commit -m "chore: update moon phase cache [skip ci]"
            git push
          fi
